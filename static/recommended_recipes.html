
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CookAI | Recommended Recipes</title>

<style>
  :root {
    --bg: #eef3f2;
    --surface: #ffffff;
    --ink: #10241f;
    --muted: #586b66;
    --line: #cfdad7;
    --green: #245c49;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 30px 20px;
    background: var(--bg);
    color: var(--ink);
    font-family: Arial, sans-serif;
  }

  .container {
    max-width: 850px;
    margin: auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
  }

  h1 {
    margin: 0;
    font-size: 30px;
  }

  .subtitle {
    color: var(--muted);
    margin-top: 8px;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 11px 17px;
    background: var(--green);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .recipe-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .recipe-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 13px;
  }

  .recipe-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .recipe-name {
    font-size: 18px;
    font-weight: bold;
  }

  .recipe-count {
    color: var(--green);
    font-size: 14px;
    font-weight: bold;
  }

  #status {
    color: var(--muted);
    margin-bottom: 20px;
  }

  .empty {
    padding: 35px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 13px;
    color: var(--muted);
  }

  @media (max-width: 500px) {
    header {
      align-items: flex-start;
      flex-direction: column;
    }
  }
</style>
</head>

<body>

<div class="container">

  <header>
    <div>
      <h1>Recommended Recipes</h1>
      <div class="subtitle">Your most frequently made recipes.</div>
    </div>

    <button onclick="window.location.href='/'">
      Back to Home
    </button>
  </header>

  <div id="status">Loading recipes...</div>
  <div id="recipes" class="recipe-list"></div>

</div>

<script>
async function loadRecipes() {
  const container = document.getElementById("recipes");
  const status = document.getElementById("status");

  try {
    const response = await fetch("/api/saved-recipes", {
      credentials: "same-origin"
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || "Could not load recipes.");
    }

    const recipes = (data.recipes || [])
      .sort((a, b) => (Number(b.quantity) || 0) - (Number(a.quantity) || 0));

    container.innerHTML = "";

    if (recipes.length === 0) {
      container.innerHTML = `
        <div class="empty">
          You haven't made any recipes yet!
        </div>
      `;
      status.textContent = "";
      return;
    }

    recipes.forEach(recipe => {
      const card = document.createElement("div");
      card.className = "recipe-card";

      const info = document.createElement("div");
      info.className = "recipe-info";

      const name = document.createElement("div");
      name.className = "recipe-name";
      name.textContent = recipe.recipe;

      const count = document.createElement("div");
      count.className = "recipe-count";

      const updateCount = () => {
        const quantity = Number(recipe.quantity) || 0;
        count.textContent = `${quantity} ${quantity === 1 ? "time" : "times"} made`;
      };

      updateCount();

      info.append(name, count);

      const button = document.createElement("button");
      button.textContent = "Make Again";

      button.onclick = async () => {
        button.disabled = true;

        try {
          const saveResponse = await fetch("/api/saved-recipes", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify(recipe.recipe)
          });

          const result = await saveResponse.json();

          if (!saveResponse.ok) {
            throw new Error(result.detail || "Could not update recipe.");
          }

          recipe.quantity = result.quantity;
          updateCount();

        } catch (error) {
          alert(error.message);
        } finally {
          button.disabled = false;
        }
      };

      card.append(info, button);
      container.appendChild(card);
    });

    status.textContent = "Ranked by how often you've made each recipe.";

  } catch (error) {
    status.textContent = error.message;
  }
}

loadRecipes();
</script>

</body>
</html>
