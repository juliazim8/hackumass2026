<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - FridgeChef</title>
<style>
  :root {
    --bg: #eef3f2; --surface: #fff; --ink: #10241f; --muted: #586b66;
    --line: #cfdad7; --accent: #1f7a5c; --warn: #b4400f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 20px; background: var(--bg); color: var(--ink);
    font: 16px/1.55 "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  main {
    width: min(100%, 400px); padding: 28px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px;
  }
  h1 { margin: 0; font-size: 2rem; }
  p { color: var(--muted); }
  label { display: block; margin: 18px 0 6px; font-weight: 600; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 6px; font: inherit;
  }
  button {
    width: 100%; margin-top: 22px; padding: 10px 18px; border: 0;
    border-radius: 6px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: wait; }
  .signup-link { text-align: center; margin: 18px 0 0; }
  .signup-link a { color: var(--accent); font-weight: 600; }
  #error { min-height: 1.5em; color: var(--warn); }
  :focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>FridgeChef</h1>
  <p>Sign in to get cooking.</p>
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">Sign in</button>
    <p id="error" role="alert" aria-live="polite"></p>
  </form>
  <p class="signup-link">New here? <a href="/signup">Create an account</a></p>
</main>
<script>
const form = document.getElementById("login-form");
const button = document.getElementById("submit");
const error = document.getElementById("error");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  button.disabled = true;
  error.textContent = "";
  try {
    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: form.elements.username.value,
        password: form.elements.password.value,
      }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "Sign-in failed.");
    window.location.assign("/");
  } catch (e) {
    error.textContent = e.message || "Unable to sign in. Try again.";
    button.disabled = false;
  }
});
</script>
</body>
</html>
